name: live-api

# Hits the real API. Needs a GOAL_API_KEY secret on the `live-api` environment; the
# tests skip without it.
on:
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: go test ./...
